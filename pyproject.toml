[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grnn-bio-manifold"
version = "7.0.0"
description = "Auditable learning experiments with fixed Allen GFR physiology"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2,<4", "matplotlib>=3.7,<4"]

[project.scripts]
grnn-bio = "grnn_bio.cli:main"

[tool.setuptools]
packages = ["grnn_bio"]
